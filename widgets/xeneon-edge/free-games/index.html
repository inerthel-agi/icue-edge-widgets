<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' http://127.0.0.1:47821; img-src 'self' data: blob: https://cdn1.epicgames.com https://shared.akamai.steamstatic.com; object-src 'none'; base-uri 'none'; form-action 'none';" />
    <title>Free Games</title>
    <meta name="x-icue-property" content="dealsCountry" data-label="tr('Store country')" data-type="combobox"
        data-default="'FR'" data-values="[{'key':'FR','value':'France'},{'key':'BE','value':'Belgium'},{'key':'CH','value':'Switzerland'},{'key':'CA','value':'Canada'},{'key':'US','value':'United States'},{'key':'GB','value':'United Kingdom'},{'key':'DE','value':'Germany'},{'key':'ES','value':'Spain'},{'key':'IT','value':'Italy'}]" />
    <meta name="x-icue-property" content="dealsSteam" data-label="tr('Steam games to watch')" data-type="textfield" data-default="''" />
    <meta name="x-icue-property" content="textColor" data-label="tr('Text Color')" data-type="color"
        data-default="'#f2f3ed'" />
    <meta name="x-icue-property" content="accentColor" data-label="tr('Accent Color')" data-type="color"
        data-default="'#e2412f'" />
    <meta name="x-icue-property" content="backgroundColor" data-label="tr('Background Color')" data-type="color"
        data-default="'#080a0b'" />
    <meta name="x-icue-property" content="transparency" data-label="tr('Background Transparency')" data-type="slider"
        data-default="100" data-min="0" data-max="100" data-step="1" data-unit-label="'%'" />
    <script type="application/json" id="x-icue-groups">
        [{"title":"tr('Free Games')","properties":["dealsCountry","dealsSteam"],"info":"tr('Free games of the week on the Epic Games Store, and the price of the Steam games you list: their app ids (the number in the store address), separated by commas. Needs iCUE Edge Companion. Tap a game to open its store page.')"},{"title":"tr('Widget Personalization')","properties":["textColor","accentColor","backgroundColor","transparency"]}]
    </script>
    <link rel="stylesheet" href="../../../shared/xeneon-widget.css" />
    <link rel="stylesheet" href="./style.css" />
</head>

<body data-endpoint="http://127.0.0.1:47821">
    <main id="widget" data-state="loading">
        <section class="free" id="free" aria-label="Free on the Epic Games Store"></section>
        <section class="watch" id="watch" aria-label="Steam games you watch"></section>
        <p class="msg" id="msg">Looking for iCUE Edge Companion…</p>
    </main>
    <script src="../../../shared/widget-runtime.js"></script>
    <script src="./app.js"></script>
</body>

</html>
