<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        data-default="'#f0f0f0'" />

        [{ "title": "tr('Widget Personalization')", "properties": ["backgroundColor", "transparency", "textColor", "accentColor"] }]
    </script>
    <link rel="stylesheet" href="./widget.css" />
</head>
