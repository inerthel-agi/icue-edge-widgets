<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' http://127.0.0.1:47821; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none';" />
    <title>Network Pulse</title>
    <meta name="x-icue-property" content="pingTarget" data-label="tr('Ping')" data-type="combobox"
        data-default="'cloudflare'" data-values="[{'key':'cloudflare','value':'Cloudflare 1.1.1.1'},{'key':'google','value':'Google 8.8.8.8'},{'key':'quad9','value':'Quad9 9.9.9.9'},{'key':'off','value':'Off'}]" />
    <meta name="x-icue-property" content="netUnits" data-label="tr('Units')" data-type="tab-buttons"
        data-default="'bits'" data-values="[{'key':'bits','value':'Mbit/s'},{'key':'bytes','value':'MB/s'}]" />
    <meta name="x-icue-property" content="textColor" data-label="tr('Text Color')" data-type="color"
        data-default="'#f2f3ed'" />
    <meta name="x-icue-property" content="accentColor" data-label="tr('Accent Color')" data-type="color"
        data-default="'#7cc8ff'" />
    <meta name="x-icue-property" content="backgroundColor" data-label="tr('Background Color')" data-type="color"
        data-default="'#080a0b'" />
    <meta name="x-icue-property" content="transparency" data-label="tr('Background Transparency')" data-type="slider"
        data-default="100" data-min="0" data-max="100" data-step="1" data-unit-label="'%'" />
    <meta name="x-icue-property" content="widgetStyle" data-label="tr('Style')" data-type="combobox"
        data-default="'instrument'" data-values="[{'key':'instrument','value':'Instrument'},{'key':'apple','value':'Apple'},{'key':'openai','value':'OpenAI'},{'key':'spacex','value':'SpaceX'},{'key':'nothing','value':'Nothing'},{'key':'anthropic','value':'Anthropic'},{'key':'google','value':'Google'},{'key':'terminal','value':'Terminal'},{'key':'corsair','value':'Corsair'},{'key':'aurora','value':'Aurora'},{'key':'paper','value':'Paper'},{'key':'brutalist','value':'Brutalist'},{'key':'synthwave','value':'Synthwave'},{'key':'abyss','value':'Abyss'},{'key':'sunset','value':'Sunset'},{'key':'newsprint','value':'Newsprint'},{'key':'blueprint','value':'Blueprint'},{'key':'forest','value':'Forest'},{'key':'pastel','value':'Pastel'},{'key':'amber','value':'Amber'},{'key':'hud','value':'HUD'},{'key':'bloomberg','value':'Bloomberg'}]" />
    <script type="application/json" id="x-icue-groups">
        [{ "title": "tr('Network Pulse')", "properties": ["pingTarget", "netUnits"] },
        { "title": "tr('Widget Personalization')", "properties": ["textColor", "accentColor", "backgroundColor", "transparency", "widgetStyle"] }]
    </script>
    <link rel="stylesheet" href="../../../shared/xeneon-widget.css" />
    <link rel="stylesheet" href="../../../shared/widget-styles.css" />
    <link rel="stylesheet" href="./style.css" />
</head>

<body>
    <main id="widget" class="x-widget">
        <header class="x-top">
            <p class="x-kicker" id="adapter">Network</p>
            <p class="x-badge ping" id="ping">Ping --</p>
        </header>
        <section class="rates">
            <div class="rate down"><span class="arrow" aria-hidden="true">↓</span><b id="down">--</b><small id="downUnit"></small></div>
            <div class="rate up"><span class="arrow" aria-hidden="true">↑</span><b id="up">--</b><small id="upUnit"></small></div>
        </section>
        <svg class="chart" id="chart" viewBox="0 0 600 200" preserveAspectRatio="none" aria-hidden="true">
            <path class="area down" id="areaDown" /><path class="line down" id="lineDown" />
            <path class="area up" id="areaUp" /><path class="line up" id="lineUp" />
        </svg>
        <p class="x-status" id="status">Waiting for the companion</p>
        <section class="overlay x-overlay" id="overlay" role="status">
            <strong id="overlayTitle"></strong>
            <span id="overlaySub"></span>
        </section>
    </main>
    <script src="../../../shared/widget-runtime.js"></script>
    <script src="./app.js"></script>
</body>

</html>
