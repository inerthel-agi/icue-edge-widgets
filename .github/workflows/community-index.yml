# Refreshes community/index.json once a day: the community widgets iCUE Edge Companion lists.
name: Community index

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: community-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the index
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/community-index.py --out community/index.json
      - name: Commit when it changed
        run: |
          # The timestamp alone does not count as a change.
          if git diff --quiet -I '"generated":' -- community/index.json && git ls-files --error-unmatch community/index.json >/dev/null 2>&1; then
            echo "No change"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add community/index.json
          git commit -m "chore(community): refresh the community widget index"
          git push
